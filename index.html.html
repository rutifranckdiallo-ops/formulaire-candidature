<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulaire de Candidature Internationale</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 font-sans text-slate-800 min-h-screen py-10 px-4">

  <div class="max-w-3xl mx-auto bg-white shadow-xl rounded-2xl overflow-hidden">

    <!-- En-tête -->
    <div class="bg-indigo-700 p-8 text-white">
      <h1 class="text-3xl font-bold">Candidature Internationale</h1>
      <p class="mt-2 text-indigo-100 text-sm">Veuillez remplir l'ensemble des informations requises pour soumettre votre dossier.</p>
    </div>

    <form id="applicationForm" class="p-8 space-y-8">

      <!-- Section 1 : Informations Personnelles -->
      <div class="space-y-4">
        <h2 class="text-xl font-semibold text-slate-900 border-b pb-2 border-slate-200">1. Informations Personnelles</h2>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label for="firstName" class="block text-sm font-medium text-slate-700 mb-1">Prénom</label>
            <input type="text" id="firstName" name="firstName" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
          </div>
          <div>
            <label for="lastName" class="block text-sm font-medium text-slate-700 mb-1">Nom</label>
            <input type="text" id="lastName" name="lastName" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label for="email" class="block text-sm font-medium text-slate-700 mb-1">Adresse Électronique</label>
            <input type="email" id="email" name="email" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
          </div>
          <div>
            <label for="phone" class="block text-sm font-medium text-slate-700 mb-1">Téléphone (avec indicatif)</label>
            <input type="tel" id="phone" name="phone" placeholder="+123..." required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
          </div>
        </div>
      </div>

      <!-- Section 2 : Origine & Localisation -->
      <div class="space-y-4">
        <h2 class="text-xl font-semibold text-slate-900 border-b pb-2 border-slate-200">2. Nationalité & Résidence</h2>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label for="countrySelect" class="block text-sm font-medium text-slate-700 mb-1">Pays de Résidence / Origine</label>
            <select id="countrySelect" name="country" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-white">
              <option value="" disabled selected>Chargement des pays...</option>
            </select>
            <p id="countryError" class="text-xs text-red-600 mt-1 hidden"></p>
          </div>

          <div>
            <label for="city" class="block text-sm font-medium text-slate-700 mb-1">Ville</label>
            <input type="text" id="city" name="city" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
          </div>
        </div>
      </div>

      <!-- Section 3 : Parcours Académique -->
      <div class="space-y-4">
        <h2 class="text-xl font-semibold text-slate-900 border-b pb-2 border-slate-200">3. Établissement & Formation</h2>

        <div>
          <label for="universitySelect" class="block text-sm font-medium text-slate-700 mb-1">Université ou Établissement d'Origine</label>
          <select id="universitySelect" name="university" required disabled class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-white disabled:bg-slate-100 disabled:cursor-not-allowed">
            <option value="" disabled selected>Sélectionnez d'abord un pays</option>
          </select>
          <p id="universityError" class="text-xs text-red-600 mt-1 hidden"></p>
        </div>

        <div class="flex items-center gap-2 mt-2">
          <input type="checkbox" id="manualUniToggle" class="rounded border-slate-300 text-indigo-600 focus:ring-indigo-500">
          <label for="manualUniToggle" class="text-sm text-slate-600">Mon établissement n'est pas dans la liste (Saisie manuelle)</label>
        </div>

        <div id="manualUniContainer" class="hidden mt-2">
          <input type="text" id="manualUniInput" name="manualUniversity" placeholder="Saisissez le nom de votre université..." class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label for="degreeLevel" class="block text-sm font-medium text-slate-700 mb-1">Niveau d'Études Actuel</label>
            <select id="degreeLevel" name="degreeLevel" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-white">
              <option value="" disabled selected>Sélectionner un niveau</option>
              <option value="licence">Bac +3 (Licence / Bachelor)</option>
              <option value="master">Bac +5 (Master)</option>
              <option value="doctorat">Doctorat (PhD)</option>
              <option value="autre">Autre</option>
            </select>
          </div>

          <div>
            <label for="fieldOfStudy" class="block text-sm font-medium text-slate-700 mb-1">Domaine d'Études</label>
            <input type="text" id="fieldOfStudy" name="fieldOfStudy" placeholder="ex. Génie Logiciel, Économie..." required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
          </div>
        </div>
      </div>

      <!-- Section 4 : Documents requis -->
      <div class="space-y-4">
        <h2 class="text-xl font-semibold text-slate-900 border-b pb-2 border-slate-200">4. Pièces Jointes</h2>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label for="cvFile" class="block text-sm font-medium text-slate-700 mb-1">Curriculum Vitae (PDF)</label>
            <input type="file" id="cvFile" name="cvFile" accept=".pdf" required class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100">
          </div>

          <div>
            <label for="transcriptFile" class="block text-sm font-medium text-slate-700 mb-1">Relevés de Notes (PDF)</label>
            <input type="file" id="transcriptFile" name="transcriptFile" accept=".pdf" required class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100">
          </div>
        </div>
      </div>

      <!-- Soumission -->
      <div class="pt-4">
        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-6 rounded-lg transition duration-200 shadow-md">
          Soumettre la Candidature
        </button>
      </div>

    </form>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const countrySelect     = document.getElementById('countrySelect');
      const universitySelect  = document.getElementById('universitySelect');
      const countryErrorEl    = document.getElementById('countryError');
      const universityErrorEl = document.getElementById('universityError');
      const manualUniToggle   = document.getElementById('manualUniToggle');
      const manualUniContainer= document.getElementById('manualUniContainer');
      const manualUniInput    = document.getElementById('manualUniInput');

      let currentAbortController = null;

      function showCountryError(message) {
        countryErrorEl.textContent = message;
        countryErrorEl.classList.toggle('hidden', !message);
      }

      function showUniversityError(message) {
        universityErrorEl.textContent = message;
        universityErrorEl.classList.toggle('hidden', !message);
      }

      // 1. Chargement des pays via API
      async function fetchCountries() {
        try {
          const response = await fetch('https://countriesnow.space/api/v0.1/countries/positions');
          if (!response.ok) throw new Error('Erreur HTTP ' + response.status);
          
          const res = await response.json();
          const countries = res.data.map(item => item.name).sort((a, b) => a.localeCompare(b));

          countrySelect.innerHTML = '<option value="" disabled selected>Sélectionnez un pays</option>';
          countries.forEach(countryName => {
            const option = document.createElement('option');
            option.value = countryName;
            option.textContent = countryName;
            countrySelect.appendChild(option);
          });
        } catch (err) {
          console.error('Erreur Pays:', err);
          showCountryError("Impossible de charger la liste des pays.");
          countrySelect.innerHTML = '<option value="" disabled selected>Erreur de chargement</option>';
        }
      }

      fetchCountries();
      countrySelect.addEventListener('change', async (e) => {
        const selectedCountry = e.target.value;
        showCountryError('');
        showUniversityError('');

        manualUniToggle.checked = false;
        manualUniContainer.classList.add('hidden');
        manualUniInput.required = false;
        manualUniInput.value = '';

        universitySelect.disabled = false;
        universitySelect.required = true;
        universitySelect.innerHTML = '<option value="" disabled selected>Chargement des universités...</option>';

        if (currentAbortController) currentAbortController.abort();
        currentAbortController = new AbortController();

        const targetUrl = `https://universities.hipolabs.com/search?country=${encodeURIComponent(selectedCountry)}`;

        try {
          const response = await fetch(targetUrl, { signal: currentAbortController.signal });
          if (!response.ok) throw new Error('Erreur HTTP ' + response.status);

          const data = await response.json();

          if (data.length === 0) {
            universitySelect.innerHTML = '<option value="Autre">Aucune université répertoriée pour ce pays</option>';
            showUniversityError("Aucun établissement trouvé. Veuillez cocher la case de saisie manuelle.");
          } else {
            universitySelect.innerHTML = '<option value="" disabled selected>Sélectionnez une université</option>';
            
            // Filtrer les doublons et trier
            const uniqueUniversities = [...new Set(data.map(u => u.name))].sort((a, b) => a.localeCompare(b));
            
            uniqueUniversities.forEach(univName => {
              const option = document.createElement('option');
              option.value = univName;
              option.textContent = univName;
              universitySelect.appendChild(option);
            });
          }
        } catch (err) {
          if (err.name === 'AbortError') return;
          console.error('Erreur Universités:', err);
          universitySelect.innerHTML = '<option value="" disabled selected>Erreur de chargement</option>';
          showUniversityError("Impossible d'accéder à l'API. Cochez la case ci-dessous pour saisir manuellement.");
        }
      });
      manualUniToggle.addEventListener('change', () => {
        const isManual = manualUniToggle.checked;
        manualUniContainer.classList.toggle('hidden', !isManual);

        if (isManual) {
          universitySelect.disabled = true;
          universitySelect.required = false;
          manualUniInput.required = true;
          manualUniInput.focus();
        } else {
          universitySelect.disabled = false;
          universitySelect.required = true;
          manualUniInput.required = false;
        }
      });
      document.getElementById('applicationForm').addEventListener('submit', (e) => {
        e.preventDefault();
        alert('Formulaire validé avec succès !');
      });
    });
  </script>
</body>
</html>
