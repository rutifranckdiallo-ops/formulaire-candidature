<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portail de Candidature en Ligne</title>
    <!-- Intégration de Select2 -->
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <style>
        :root {
            --brand-blue: #009EDB;
            --brand-dark-blue: #1C3F60;
            --bg-color: #f4f7f9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #cbd5e1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 850px;
            margin: 0 auto;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, var(--brand-dark-blue), var(--brand-blue));
            color: white;
            padding: 35px 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 1.8rem;
            margin-bottom: 10px;
            font-weight: 600;
        }

        form {
            padding: 35px 40px;
        }

        fieldset {
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 25px;
            margin-bottom: 25px;
            background-color: #fafbfc;
        }

        legend {
            font-weight: bold;
            color: var(--brand-dark-blue);
            font-size: 1.1rem;
            padding: 0 10px;
            background-color: white;
            border: 1px solid var(--border-color);
            border-radius: 4px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group.full-width {
            grid-column: span 2;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            color: #1e293b;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="date"],
        select,
        input[type="file"] {
            width: 100%;
            padding: 11px 14px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.95rem;
            background-color: #ffffff;
            color: #334155;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--brand-blue);
            box-shadow: 0 0 0 3px rgba(0, 158, 219, 0.15);
        }

        .select2-container .select2-selection--single {
            height: 46px !important;
            border: 1px solid var(--border-color) !important;
            border-radius: 6px !important;
            padding: 8px 4px;
        }
        .select2-container--default .select2-selection--single .select2-selection__arrow {
            height: 44px !important;
        }
        .select2-container--default .select2-selection--single .select2-selection__rendered {
            color: #334155 !important;
            line-height: 28px !important;
        }

        .error-msg {
            font-size: 0.85rem;
            color: #dc2626;
            margin-top: 5px;
            display: block;
        }

        .checkbox-container {
            margin-top: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            color: #475569;
        }

        .btn-submit {
            background-color: var(--brand-blue);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
        }

        .btn-submit:hover {
            background-color: #0082b8;
        }

        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }
            .form-group.full-width {
                grid-column: span 1;
            }
            form {
                padding: 20px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Portail de Candidature en Ligne</h1>
    </div>

    <form action="traitement_candidature.php" method="POST" enctype="multipart/form-data">

        <!-- Informations Personnelles -->
        <fieldset>
            <legend>1. Informations Personnelles</legend>
            <div class="form-row">
                <div class="form-group">
                    <label for="nom">Nom de famille *</label>
                    <input type="text" id="nom" name="nom" required placeholder="Ex: Nkurunziza">
                </div>
                <div class="form-group">
                    <label for="prenom">Prénom(s) *</label>
                    <input type="text" id="prenom" name="prenom" required placeholder="Ex: Marie">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="date_naissance">Date de naissance *</label>
                    <input type="date" id="date_naissance" name="date_naissance" required>
                </div>
                <div class="form-group">
                    <label for="genre">Genre *</label>
                    <select id="genre" name="genre" required>
                        <option value="">-- Sélectionnez --</option>
                        <option value="F">Féminin</option>
                        <option value="M">Masculin</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="email">Courriel (Email) *</label>
                    <input type="email" id="email" name="email" required placeholder="exemple@gmail.com">
                </div>
                <div class="form-group">
                    <label for="telephone">Numéro de téléphone *</label>
                    <input type="tel" id="telephone" name="telephone" required placeholder="+257.....">
                </div>
            </div>
        </fieldset>

        <!-- Localisation & Nationalité -->
        <fieldset>
            <legend>2. Localisation &amp; Nationalité</legend>
            <div class="form-row">
                <div class="form-group">
                    <label for="pays_residence">Pays de résidence actuel *</label>
                    <select id="pays_residence" name="pays_residence" class="select2-pays" required>
                        <option value="">-- Sélectionnez un pays --</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="nationalite">Nationalité principale *</label>
                    <select id="nationalite" name="nationalite" class="select2-pays" required>
                        <option value="">-- Sélectionnez un pays --</option>
                    </select>
                </div>
            </div>
        </fieldset>

        <!-- Parcours Académique -->
        <fieldset>
            <legend>3. Parcours Académique</legend>
            <div class="form-row">
                <div class="form-group">
                    <label for="niveau_etudes">Niveau d'études *</label>
                    <select id="niveau_etudes" name="niveau_etudes" required>
                        <option value="">-- Sélectionnez --</option>
                        <option value="Licence">Licence (Bachelor)</option>
                        <option value="Master">Master / Magistère</option>
                        <option value="Doctorat">Doctorat (Ph.D.)</option>
                        <option value="Autre">Autre diplôme supérieur</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="domaine_etudes">Domaine d'études / Spécialité *</label>
                    <input type="text" id="domaine_etudes" name="domaine_etudes" required placeholder="Ex: Informatique / Génie Logiciel">
                </div>
            </div>

            <div class="form-row">
                <!-- Pays de l'établissement -->
                <div class="form-group">
                    <label for="pays_universite">Pays de l'établissement *</label>
                    <select id="pays_universite" name="pays_universite" class="select2-pays" required>
                        <option value="">-- Sélectionnez un pays --</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="annee_diplome">Année d'obtention *</label>
                    <select id="annee_diplome" name="annee_diplome" required>
                        <option value="">-- Année --</option>
                    </select>
                </div>
            </div>

            <!-- Nom de l'Université -->
            <div class="form-group full-width">
                <label for="universite">Nom de l'Université Accréditée *</label>
                <select id="universite" name="universite" class="select2-universites" disabled required>
                    <option value="">-- D'abord, sélectionnez un pays d'établissement ci-dessus --</option>
                </select>
                <span id="universityError" class="error-msg"></span>

                <div class="checkbox-container">
                    <input type="checkbox" id="manualUniToggle">
                    <label for="manualUniToggle" style="margin:0; font-weight:normal;">Mon établissement n'apparaît pas dans la liste</label>
                </div>
                <input type="text" id="manualUniInput" name="universite_manuelle" placeholder="Saisissez le nom de votre établissement" style="display:none; margin-top:10px;">
            </div>
        </fieldset>

        <!-- Postes et Expérience -->
        <fieldset>
            <legend>4. Poste Souhaité</legend>
            <div class="form-row">
                <div class="form-group">
                    <label for="categorie_poste">Catégorie de poste visé *</label>
                    <select id="categorie_poste" name="categorie_poste" required>
                        <option value="">-- Sélectionnez --</option>
                        <option value="Junior">Poste Junior</option>
                        <option value="Confirme">Poste Confirmé</option>
                        <option value="Manager">Poste Managérial</option>
                        <option value="Consultant">Consultant / Expert Externe</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="departement">Département visé *</label>
                    <select id="departement" name="departement" required>
                        <option value="">-- Sélectionnez un département --</option>
                        <option value="RH">Ressources Humaines</option>
                        <option value="IT">Informatique / IT</option>
                        <option value="Finance">Finance</option>
                        <option value="Communication">Communication</option>
                        <option value="Logistique">Logistique</option>
                    </select>
                </div>
            </div>
        </fieldset>

        <!-- Pièces Justificatives -->
        <fieldset>
            <legend>5. Pièces Justificatives</legend>
            <div class="form-row">
                <div class="form-group">
                    <label for="cv">Curriculum Vitae (CV) - Format PDF *</label>
                    <input type="file" id="cv" name="cv" accept=".pdf" required>
                </div>
                <div class="form-group">
                    <label for="lettre_motivation">Lettre de motivation - Format PDF *</label>
                    <input type="file" id="lettre_motivation" name="lettre_motivation" accept=".pdf" required>
                </div>
            </div>
        </fieldset>

        <button type="submit" class="btn-submit">Soumettre la candidature</button>
    </form>
</div>

<!-- Scripts JS : jQuery & Select2 -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
<script>
    $(document).ready(function() {

        // 1) Données des Pays (Nom FR pour l'affichage, Nom EN pour correspondre au JSON Hipo)
        const COUNTRIES = [
            {en:"Afghanistan",fr:"Afghanistan"}, {en:"South Africa",fr:"Afrique du Sud"}, {en:"Albania",fr:"Albanie"},
            {en:"Algeria",fr:"Algérie"}, {en:"Germany",fr:"Allemagne"}, {en:"Andorra",fr:"Andorre"}, {en:"Angola",fr:"Angola"},
            {en:"Saudi Arabia",fr:"Arabie saoudite"}, {en:"Argentina",fr:"Argentine"}, {en:"Armenia",fr:"Arménie"},
            {en:"Australia",fr:"Australie"}, {en:"Austria",fr:"Autriche"}, {en:"Azerbaijan",fr:"Azerbaïdjan"},
            {en:"Belgium",fr:"Belgique"}, {en:"Benin",fr:"Bénin"}, {en:"Belarus",fr:"Biélorussie"},
            {en:"Bolivia",fr:"Bolivie"}, {en:"Bosnia & Herzegovina",fr:"Bosnie-Herzégovine"}, {en:"Brazil",fr:"Brésil"},
            {en:"Bulgaria",fr:"Bulgarie"}, {en:"Burkina Faso",fr:"Burkina Faso"}, {en:"Burundi",fr:"Burundi"},
            {en:"Cambodia",fr:"Cambodge"}, {en:"Cameroon",fr:"Cameroun"}, {en:"Canada",fr:"Canada"},
            {en:"Cape Verde",fr:"Cap-Vert"}, {en:"Chile",fr:"Chili"}, {en:"China",fr:"Chine"},
            {en:"Colombia",fr:"Colombie"}, {en:"Congo, Republic of the",fr:"Congo-Brazzaville"}, {en:"Congo, Democratic Republic of the",fr:"Congo-Kinshasa"},
            {en:"Korea, Republic of",fr:"Corée du Sud"}, {en:"Costa Rica",fr:"Costa Rica"}, {en:"Côte d'Ivoire",fr:"Côte d’Ivoire"},
            {en:"Croatia",fr:"Croatie"}, {en:"Cuba",fr:"Cuba"}, {en:"Denmark",fr:"Danemark"}, {en:"Djibouti",fr:"Djibouti"},
            {en:"Egypt",fr:"Égypte"}, {en:"United Arab Emirates",fr:"Émirats arabes unis"}, {en:"Ecuador",fr:"Équateur"},
            {en:"Spain",fr:"Espagne"}, {en:"Estonia",fr:"Estonie"}, {en:"United States",fr:"États-Unis"},
            {en:"Ethiopia",fr:"Éthiopie"}, {en:"Finland",fr:"Finlande"}, {en:"France",fr:"France"},
            {en:"Gabon",fr:"Gabon"}, {en:"Georgia",fr:"Géorgie"}, {en:"Ghana",fr:"Ghana"}, {en:"Greece",fr:"Grèce"},
            {en:"Guinea",fr:"Guinée"}, {en:"Haiti",fr:"Haïti"}, {en:"Hungary",fr:"Hongrie"}, {en:"India",fr:"Inde"},
            {en:"Indonesia",fr:"Indonésie"}, {en:"Iraq",fr:"Irak"}, {en:"Iran, Islamic Republic of",fr:"Iran"}, {en:"Ireland",fr:"Irlande"},
            {en:"Israel",fr:"Israël"}, {en:"Italy",fr:"Italie"}, {en:"Japan",fr:"Japon"}, {en:"Jordan",fr:"Jordanie"},
            {en:"Kenya",fr:"Kenya"}, {en:"Lebanon",fr:"Liban"}, {en:"Madagascar",fr:"Madagascar"}, {en:"Morocco",fr:"Maroc"},
            {en:"Mauritania",fr:"Mauritanie"}, {en:"Mexico",fr:"Mexique"}, {en:"Moldova, Republic of",fr:"Moldavie"},
            {en:"Niger",fr:"Niger"}, {en:"Nigeria",fr:"Nigeria"}, {en:"Norway",fr:"Norvège"}, {en:"Uganda",fr:"Ouganda"},
            {en:"Pakistan",fr:"Pakistan"}, {en:"Netherlands",fr:"Pays-Bas"}, {en:"Peru",fr:"Pérou"},
            {en:"Poland",fr:"Pologne"}, {en:"Portugal",fr:"Portugal"}, {en:"Central African Republic",fr:"République centrafricaine"},
            {en:"Romania",fr:"Roumanie"}, {en:"United Kingdom",fr:"Royaume-Uni"}, {en:"Russian Federation",fr:"Russie"},
            {en:"Rwanda",fr:"Rwanda"}, {en:"Senegal",fr:"Sénégal"}, {en:"Serbia",fr:"Serbie"}, {en:"Slovakia",fr:"Slovaquie"},
            {en:"Sudan",fr:"Soudan"}, {en:"Sweden",fr:"Suède"}, {en:"Switzerland",fr:"Suisse"}, {en:"Syrian Arab Republic",fr:"Syrie"},
            {en:"Tanzania, United Republic of",fr:"Tanzanie"}, {en:"Chad",fr:"Tchad"}, {en:"Czech Republic",fr:"Tchéquie"}, {en:"Togo",fr:"Togo"},
            {en:"Tunisia",fr:"Tunisie"}, {en:"Turkey",fr:"Turquie"}, {en:"Ukraine",fr:"Ukraine"}, {en:"Uruguay",fr:"Uruguay"},
            {en:"Venezuela, Bolivarian Republic of",fr:"Venezuela"}, {en:"Viet Nam",fr:"Viêt Nam"}, {en:"Zambia",fr:"Zambie"}, {en:"Zimbabwe",fr:"Zimbabwe"}
        ].sort((a, b) => a.fr.localeCompare(b.fr, 'fr'));

        // Remplissage des Selects Pays
        let optionsPays = '<option value="">-- Sélectionnez un pays --</option>';
        COUNTRIES.forEach(c => {
            optionsPays += `<option value="${c.en}">${c.fr}</option>`;
        });
        $('.select2-pays').html(optionsPays).select2({
            placeholder: "-- Sélectionnez un pays --",
            allowClear: true,
            width: '100%'
        });

        // Initialisation Select2 Universités
        const $uniSelect = $('#universite').select2({
            placeholder: "-- Sélectionnez d'abord un pays d'établissement --",
            allowClear: true,
            width: '100%'
        });

        // 2) Chargement unique du jeu de données statique Hipo via jsDelivr CDN
        let allUniversities = null;

        function fetchAllUniversitiesOnce() {
            if (allUniversities) {
                return $.Deferred().resolve(allUniversities).promise();
            }
            return $.ajax({
                url: 'https://cdn.jsdelivr.net/gh/Hipo/university-domains-list/world_universities_and_domains.json',
                dataType: 'json'
            }).then(function(data) {
                allUniversities = data;
                return allUniversities;
            });
        }

        // Filtrage côté client lors de la sélection du pays
        $('#pays_universite').on('change', function() {
            const countryEn = $(this).val();
            const $errorMsg = $('#universityError');
            $errorMsg.text('');

            if (!countryEn) {
                $uniSelect.prop('disabled', true).html('<option value="">-- D\'abord, sélectionnez un pays d\'établissement --</option>').trigger('change');
                return;
            }

            $uniSelect.prop('disabled', false).html('<option value="">Chargement des universités...</option>').trigger('change');

            fetchAllUniversitiesOnce().then(function(data) {
                const matches = data.filter(u => u.country === countryEn);

                if (!matches.length) {
                    $uniSelect.html('<option value="">Aucune université répertoriée pour ce pays</option>').trigger('change');
                    $errorMsg.text("Aucun établissement n'a été trouvé. Cochez la case ci-dessous pour le saisir manuellement.");
                    return;
                }

                const uniqueNames = [...new Set(matches.map(u => u.name))].sort((a, b) => a.localeCompare(b, 'fr'));
                let optionsUni = '<option value="">-- Sélectionnez une université --</option>';
                uniqueNames.forEach(name => {
                    optionsUni += `<option value="${name}">${name}</option>`;
                });
                $uniSelect.html(optionsUni).trigger('change');
            }).catch(function(err) {
                console.error(err);
                $uniSelect.html('<option value="">Erreur de chargement</option>').trigger('change');
                $errorMsg.text("Impossible de charger la liste globale. Cochez la case ci-dessous pour le saisir manuellement.");
            });
        });

        // 3) Mode de saisie manuelle de secours
        $('#manualUniToggle').on('change', function() {
            const useManual = $(this).is(':checked');
            if (useManual) {
                $('#manualUniInput').show().prop('required', true);
                $uniSelect.prop('disabled', true).prop('required', false);
            } else {
                $('#manualUniInput').hide().prop('required', false);
                $uniSelect.prop('disabled', !$('#pays_universite').val()).prop('required', true);
            }
        });

        // Génération des années d'obtention
        let $anneeSelect = $('#annee_diplome');
        let currentYear = new Date().getFullYear();
        for (let y = currentYear; y >= 1970; y--) {
            $anneeSelect.append(`<option value="${y}">${y}</option>`);
        }
    });
</script>

</body>
</html>
